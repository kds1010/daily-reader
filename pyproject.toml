[project]
name = "daily-reader"
version = "0.1.0"
description = "A zero-cost personal news and information dashboard for iPhone and Mac"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "feedparser>=6.0.11,<7",
  "google-api-python-client>=2.179,<3",
  "google-auth-oauthlib>=1.2,<2",
  "faster-whisper>=1.2,<2",
  "pyannote.audio>=4.0,<5",
]

[project.scripts]
daily-reader = "daily_reader.cli:main"
daily-reader-local = "daily_reader.local_server:main"
daily-reader-gmail = "daily_reader.email_assistant:main"
daily-reader-agent-worker = "daily_reader.agent_worker:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daily_reader"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
